<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> - </title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2e7d32 0%, #43a047 50%, #81c784 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .welcome-container {
            background: white;
            border-radius: 24px;
            padding: 48px 64px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #2e7d32, #43a047);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
        }
        h1 {
            font-size: 1.8rem;
            color: #1b5e20;
            margin-bottom: 12px;
        }
        .subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 32px;
        }
        .features {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px;
            background: #f5f5f5;
            border-radius: 12px;
            min-width: 100px;
        }
        .feature-item i {
            font-size: 1.5rem;
            color: #2e7d32;
        }
        .feature-item span {
            font-size: 0.8rem;
            color: #666;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2e7d32, #43a047);
            color: white;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #2e7d32;
            color: #2e7d32;
        }
        .btn-outline:hover {
            background: #2e7d32;
            color: white;
        }
        .footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #eee;
            font-size: 0.85rem;
            color: #999;
        }
        @media (max-width: 600px) {
            .welcome-container {
                padding: 32px 24px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .features {
                gap: 12px;
            }
            .feature-item {
                min-width: 80px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="logo"></div>
        <h1></h1>
        <p class="subtitle"></p>
        
        <div class="features">
            <div class="feature-item">
                <i class="fas fa-image"></i>
                <span></span>
            </div>
            <div class="feature-item">
                <i class="fas fa-chart-bar"></i>
                <span></span>
            </div>
            <div class="feature-item">
                <i class="fas fa-map"></i>
                <span></span>
            </div>
        </div>
        
        <div class="btn-group">
            <button class="btn btn-primary" onclick="location.href='/dashboard'">
                <i class="fas fa-sign-in-alt"></i> 
            </button>
            <button class="btn btn-outline" onclick="location.href='/help'">
                <i class="fas fa-question-circle"></i> 
            </button>
        </div>
        
        <div class="footer">
             2026  |  1.0.0
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ?- </title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css"><link rel="stylesheet" href="/static/css/responsive.css">
    <link rel="stylesheet" href="/static/css/animations.css">
</head>
<body>
    {% include 'navbar.html' %}
    
    <div class="app-container">
        {% include 'sidebar.html' %}
        
        <main class="main-content" id="mainContent">
            <div class="page-header animate-fade-in">
                <h1></h1>
                <p>?/p>
            </div>

            <div class="analysis-container">
                <div class="upload-section animate-fade-in" style="animation-delay: 0.1s">
                    <div class="section-header">
                        <h2><i class="fas fa-upload"></i> </h2>
                    </div>
                    
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">
                            <i class="fas fa-cloud-upload-alt"></i>
                        </div>
                        <p></p>
                        <p class="upload-hint"> JPGPNGBMP ?50MB</p>
                        <input type="file" id="fileInput" accept="image/*" style="display: none">
                    </div>
                    
                    <div class="preview-section" id="previewSection">
                        <div class="preview-placeholder">
                            <i class="fas fa-image"></i>
                            <p></p>
                        </div>
                    </div>
                </div>

                <div class="settings-section animate-fade-in" style="animation-delay: 0.2s">
                    <div class="section-header">
                        <h2><i class="fas fa-cog"></i> </h2>
                    </div>
                    
                    <div class="settings-card">
                        <div class="setting-item">
                            <label></label>
                            <div class="crop-selector" id="cropSelector">
                                <div class="crop-chip active" data-crop="Pepper__bell">
                                    <span></span>
                                    <span></span>
                                </div>
                                <div class="crop-chip" data-crop="Potato">
                                    <span></span>
                                    <span></span>
                                </div>
                                <div class="crop-chip" data-crop="Tomato">
                                    <span></span>
                                    <span></span>
                                </div>
                                <div class="crop-chip" data-crop="Lychee">
                                    <span></span>
                                    <span></span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="setting-item">
                            <div class="setting-label">
                                <label></label>
                                <span class="setting-value">50%</span>
                            </div>
                            <input type="range" id="sensitivitySlider" min="10" max="100" value="50">
                            <div class="slider-labels">
                                <span>?/span>
                                <span>?/span>
                            </div>
                        </div>
                        
                        <div class="setting-item">
                            <div class="setting-label">
                                <label>?/label>
                                <span class="setting-value">0.5</span>
                            </div>
                            <input type="range" id="confidenceSlider" min="0" max="1" step="0.05" value="0.5">
                            <div class="slider-labels">
                                <span>0.0</span>
                                <span>1.0</span>
                            </div>
                        </div>
                        
                        <div class="setting-item">
                            <label class="checkbox-label">
                                <input type="checkbox" id="showConfidence" checked>
                                <span>?/span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="action-section animate-fade-in" style="animation-delay: 0.3s">
                    <button class="btn btn-primary btn-lg" id="analyzeBtn">
                        <i class="fas fa-play"></i>
                        ?
                    </button>
                    <button class="btn btn-outline btn-lg" id="clearBtn">
                        <i class="fas fa-trash"></i>
                        
                    </button>
                </div>
            </div>

            <div class="analysis-result" id="analysisResult" style="display: none;">
                <div class="page-header animate-fade-in">
                    <h1></h1>
                    <p>?/p>
                </div>
                
                <div class="result-content">
                    <div class="result-images animate-fade-in" style="animation-delay: 0.1s">
                        <div class="image-card">
                            <div class="card-header">
                                <h3></h3>
                            </div>
                            <img id="originalImage" src="" alt="" class="result-image">
                        </div>
                        <div class="image-card">
                            <div class="card-header">
                                <h3>?/h3>
                            </div>
                            <img id="markedImage" src="" alt="? class="result-image">
                        </div>
                    </div>
                    
                    <div class="result-stats animate-fade-in" style="animation-delay: 0.2s">
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-icon primary">
                                    <i class="fas fa-leaf"></i>
                                </div>
                                <div class="stat-info">
                                    <div class="stat-value" id="resultTotal">0</div>
                                    <div class="stat-label"></div>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon success">
                                    <i class="fas fa-check-circle"></i>
                                </div>
                                <div class="stat-info">
                                    <div class="stat-value" id="resultMature">0</div>
                                    <div class="stat-label">?/div>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon warning">
                                    <i class="fas fa-chart-line"></i>
                                </div>
                                <div class="stat-info">
                                    <div class="stat-value" id="resultRate">0%</div>
                                    <div class="stat-label">?/div>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon info">
                                    <i class="fas fa-clock"></i>
                                </div>
                                <div class="stat-info">
                                    <div class="stat-value" id="resultTime">0s</div>
                                    <div class="stat-label"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="result-details animate-fade-in" style="animation-delay: 0.3s">
                        <div class="card-header">
                            <h3><i class="fas fa-list"></i> ?/h3>
                        </div>
                        <div class="detection-list" id="detectionList"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/page.js"></script>
</body>
</html>

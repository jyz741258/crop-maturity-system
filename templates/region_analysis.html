<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作物成熟度分析系统 - 区域分析</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <style>
        .region-analysis-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }
        
        .panel {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        
        .panel-title {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .upload-area {
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafbfc;
        }
        
        .upload-area:hover, .upload-area.dragover {
            border-color: #22c55e;
            background: #f0fdf4;
        }
        
        .upload-icon {
            font-size: 48px;
            color: #22c55e;
            margin-bottom: 16px;
        }
        
        .upload-text {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .upload-hint {
            color: #94a3b8;
            font-size: 12px;
        }
        
        .image-preview {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        
        .image-preview.show {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #475569;
            font-size: 14px;
        }
        
        .form-group select, .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: white;
        }
        
        .form-group select:focus, .form-group input:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            color: white;
            padding: 14px 32px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .result-image-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .result-image {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .heatmap-legend {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 16px;
            border-radius: 8px;
            color: white;
            font-size: 12px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        
        .legend-item:last-child {
            margin-bottom: 0;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #bbf7d0;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #16a34a;
        }
        
        .stat-label {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }
        
        .maturity-chart {
            margin-top: 20px;
        }
        
        .maturity-bar-item {
            margin-bottom: 16px;
        }
        
        .maturity-bar-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
            color: #475569;
        }
        
        .maturity-bar-container {
            height: 24px;
            background: #f1f5f9;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .maturity-bar-fill {
            height: 100%;
            border-radius: 12px;
            transition: width 0.6s ease;
            display: flex;
            align-items: center;
            padding-left: 12px;
            color: white;
            font-size: 11px;
            font-weight: 500;
        }
        
        .maturity-bar-fill.young {
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
        }
        
        .maturity-bar-fill.mature {
            background: linear-gradient(90deg, #16a34a, #22c55e);
        }
        
        .maturity-bar-fill.overripe {
            background: linear-gradient(90deg, #ea580c, #fb923c);
        }
        
        .maturity-bar-fill.senile {
            background: linear-gradient(90deg, #64748b, #94a3b8);
        }
        
        .region-list {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 8px;
        }
        
        .region-item {
            background: #f8fafc;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 12px;
            border-left: 4px solid #22c55e;
            transition: all 0.3s ease;
        }
        
        .region-item:hover {
            background: #f1f5f9;
            transform: translateX(4px);
        }
        
        .region-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .region-title {
            font-weight: 600;
            color: #2d3748;
            font-size: 14px;
        }
        
        .region-coords {
            font-size: 12px;
            color: #94a3b8;
        }
        
        .region-stats {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #64748b;
        }
        
        .region-maturity {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e2e8f0;
        }
        
        .maturity-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            margin-right: 8px;
            margin-bottom: 4px;
        }
        
        .maturity-tag.young {
            background: #fef3c7;
            color: #d97706;
        }
        
        .maturity-tag.mature {
            background: #dcfce7;
            color: #166534;
        }
        
        .maturity-tag.overripe {
            background: #ffedd5;
            color: #c2410c;
        }
        
        .maturity-tag.senile {
            background: #f1f5f9;
            color: #475569;
        }
        
        .download-section {
            display: flex;
            gap: 12px;
        }
        
        .download-btn {
            flex: 1;
            background: #f1f5f9;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #475569;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .download-btn:hover {
            background: #e2e8f0;
            color: #2d3748;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            display: none;
        }
        
        .loading-overlay.show {
            display: flex;
        }
        
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #22c55e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 16px;
            color: #64748b;
            font-size: 14px;
        }
        
        .density-map-container {
            margin-top: 24px;
        }
        
        .density-title {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 12px;
        }
        
        .density-canvas {
            width: 100%;
            border-radius: 8px;
            background: #f8fafc;
        }

        @media (max-width: 1024px) {
            .region-analysis-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    
    <div class="app-container">
        {% include 'sidebar.html' %}
        
        <main class="main-content" id="mainContent">
            <div class="page-header animate-fade-in">
                <h1><i class="fas fa-map-pin"></i> 区域分析</h1>
                <p>对一片区域进行作物成熟度检测和热力图可视化</p>
            </div>

            <div class="region-analysis-container">
                <div class="panel animate-fade-in" style="animation-delay: 0.1s">
                    <div class="panel-title">
                        <i class="fas fa-upload"></i> 上传图片
                    </div>
                    
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">
                            <i class="fas fa-cloud-upload-alt"></i>
                        </div>
                        <div class="upload-text">点击或拖拽上传区域图片</div>
                        <div class="upload-hint">支持 JPG、PNG、BMP 格式，最大50MB</div>
                        <input type="file" id="imageInput" accept="image/*" style="display: none">
                    </div>
                    
                    <img id="previewImage" class="image-preview" alt="预览图片">
                    
                    <div class="form-group">
                        <label for="cropType">作物类型</label>
                        <select id="cropType">
                            <option value="Pepper__bell">甜椒</option>
                            <option value="Potato">土豆</option>
                            <option value="Tomato">番茄</option>
                            <option value="Lychee">荔枝</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="gridSize">网格大小 (像素)</label>
                        <input type="number" id="gridSize" value="50" min="20" max="100">
                    </div>
                    
                    <button class="btn-primary" id="analyzeBtn" disabled>
                        <i class="fas fa-play"></i> 开始分析
                    </button>
                </div>

                <div class="panel animate-fade-in" style="animation-delay: 0.2s">
                    <div class="panel-title">
                        <i class="fas fa-chart-map"></i> 分析结果
                    </div>
                    
                    <div class="result-image-container" id="resultContainer">
                        <img id="resultImage" class="result-image" alt="分析结果" style="display: none;">
                        <div class="heatmap-legend" id="heatmapLegend">
                            <div class="legend-item">
                                <div class="legend-color" style="background: #f59e0b;"></div>
                                <span>幼嫩期</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color" style="background: #22c55e;"></div>
                                <span>成熟期</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color" style="background: #ea580c;"></div>
                                <span>过熟期</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color" style="background: #64748b;"></div>
                                <span>衰老期</span>
                            </div>
                        </div>
                        <div class="loading-overlay" id="loadingOverlay">
                            <div class="loading-spinner"></div>
                            <div class="loading-text">正在分析区域...</div>
                        </div>
                    </div>
                    
                    <div class="download-section" id="downloadSection" style="display: none;">
                        <button class="download-btn" id="heatmapDownload">
                            <i class="fas fa-download"></i> 下载热力图
                        </button>
                        <button class="download-btn" id="labeledDownload">
                            <i class="fas fa-download"></i> 下载标注图
                        </button>
                    </div>
                </div>
            </div>

            <div class="region-analysis-container">
                <div class="panel animate-fade-in" style="animation-delay: 0.3s">
                    <div class="panel-title">
                        <i class="fas fa-bar-chart"></i> 统计概览
                    </div>
                    
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value" id="totalCount">0</div>
                            <div class="stat-label">检测总数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="regionCount">0</div>
                            <div class="stat-label">分析区域数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="avgConfidence">0%</div>
                            <div class="stat-label">平均置信度</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="avgGreenRatio">0%</div>
                            <div class="stat-label">平均绿色比</div>
                        </div>
                    </div>
                    
                    <div class="maturity-chart">
                        <div class="maturity-bar-item">
                            <div class="maturity-bar-header">
                                <span>幼嫩期</span>
                                <span id="youngCount">0</span>
                            </div>
                            <div class="maturity-bar-container">
                                <div class="maturity-bar-fill young" id="youngBar"></div>
                            </div>
                        </div>
                        <div class="maturity-bar-item">
                            <div class="maturity-bar-header">
                                <span>成熟期</span>
                                <span id="matureCount">0</span>
                            </div>
                            <div class="maturity-bar-container">
                                <div class="maturity-bar-fill mature" id="matureBar"></div>
                            </div>
                        </div>
                        <div class="maturity-bar-item">
                            <div class="maturity-bar-header">
                                <span>过熟期</span>
                                <span id="overripeCount">0</span>
                            </div>
                            <div class="maturity-bar-container">
                                <div class="maturity-bar-fill overripe" id="overripeBar"></div>
                            </div>
                        </div>
                        <div class="maturity-bar-item">
                            <div class="maturity-bar-header">
                                <span>衰老期</span>
                                <span id="senileCount">0</span>
                            </div>
                            <div class="maturity-bar-container">
                                <div class="maturity-bar-fill senile" id="senileBar"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="panel animate-fade-in" style="animation-delay: 0.4s">
                    <div class="panel-title">
                        <i class="fas fa-th-large"></i> 区域详情
                    </div>
                    
                    <div class="region-list" id="regionList">
                        <div style="text-align: center; color: #94a3b8; padding: 40px;">
                            <i class="fas fa-map-marker-alt" style="font-size: 48px; margin-bottom: 16px; opacity: 0.5;"></i>
                            <p>请上传图片进行区域分析</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel animate-fade-in" style="animation-delay: 0.5s;">
                <div class="panel-title">
                    <i class="fas fa-chart-area"></i> 密度分布图
                </div>
                <div class="density-map-container">
                    <canvas id="densityCanvas" class="density-canvas" width="800" height="200"></canvas>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const uploadArea = document.getElementById('uploadArea');
            const imageInput = document.getElementById('imageInput');
            const previewImage = document.getElementById('previewImage');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const resultImage = document.getElementById('resultImage');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const downloadSection = document.getElementById('downloadSection');
            const heatmapDownload = document.getElementById('heatmapDownload');
            const labeledDownload = document.getElementById('labeledDownload');

            uploadArea.addEventListener('click', () => imageInput.click());

            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) handleFile(files[0]);
            });

            imageInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) handleFile(e.target.files[0]);
            });

            function handleFile(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    previewImage.classList.add('show');
                    analyzeBtn.disabled = false;
                };
                reader.readAsDataURL(file);
            }

            analyzeBtn.addEventListener('click', () => {
                const file = imageInput.files[0];
                if (!file) return;

                const formData = new FormData();
                formData.append('image', file);
                formData.append('crop_type', document.getElementById('cropType').value);
                formData.append('grid_size', document.getElementById('gridSize').value);

                loadingOverlay.classList.add('show');
                resultImage.style.display = 'none';
                downloadSection.style.display = 'none';

                fetch('/api/analyze_region', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    loadingOverlay.classList.remove('show');
                    
                    if (data.success) {
                        resultImage.src = data.labeled_image_path + '?' + Date.now();
                        resultImage.style.display = 'block';
                        downloadSection.style.display = 'flex';
                        
                        heatmapDownload.onclick = () => {
                            window.location.href = data.heatmap_download_url;
                        };
                        labeledDownload.onclick = () => {
                            window.location.href = data.labeled_download_url;
                        };
                        
                        updateStats(data);
                        updateRegionList(data.regions);
                        drawDensityChart(data.regions);
                    } else {
                        alert('分析失败: ' + data.error);
                    }
                })
                .catch(error => {
                    loadingOverlay.classList.remove('show');
                    alert('分析失败: ' + error.message);
                });
            });

            function updateStats(data) {
                document.getElementById('totalCount').textContent = data.total_count || 0;
                document.getElementById('regionCount').textContent = (data.regions || []).length;
                document.getElementById('avgConfidence').textContent = (data.average_confidence || 0) + '%';
                document.getElementById('avgGreenRatio').textContent = ((data.average_green_ratio || 0) * 100).toFixed(1) + '%';

                const counts = data.counts_by_maturity || {};
                const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;

                const maturityMapping = {
                    '幼嫩期': 'young',
                    '成熟期': 'mature',
                    '过熟期': 'overripe',
                    '衰老期': 'senile'
                };

                Object.entries(maturityMapping).forEach(([maturity, id]) => {
                    const count = counts[maturity] || 0;
                    document.getElementById(id + 'Count').textContent = count;
                    document.getElementById(id + 'Bar').style.width = (count / total * 100) + '%';
                    document.getElementById(id + 'Bar').textContent = count;
                });
            }

            function updateRegionList(regions) {
                const container = document.getElementById('regionList');
                
                if (!regions || regions.length === 0) {
                    container.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 40px;"><i class="fas fa-map-marker-alt" style="font-size: 48px; margin-bottom: 16px; opacity: 0.5;"></i><p>未检测到区域数据</p></div>';
                    return;
                }

                const maturityColors = {
                    '幼嫩期': 'young',
                    '成熟期': 'mature',
                    '过熟期': 'overripe',
                    '衰老期': 'senile'
                };

                container.innerHTML = regions.map((region, index) => `
                    <div class="region-item">
                        <div class="region-header">
                            <span class="region-title">区域 ${index + 1}</span>
                            <span class="region-coords">网格 (${region.grid_x}, ${region.grid_y})</span>
                        </div>
                        <div class="region-stats">
                            <span>检测数: <strong>${region.detection_count}</strong></span>
                            <span>主导成熟度: <strong>${region.dominant_maturity}</strong></span>
                        </div>
                        <div class="region-maturity">
                            ${Object.entries(region.counts_by_maturity).map(([maturity, count]) => `
                                <span class="maturity-tag ${maturityColors[maturity] || 'senile'}">
                                    ${maturity}: ${count}
                                </span>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            }

            function drawDensityChart(regions) {
                const canvas = document.getElementById('densityCanvas');
                const ctx = canvas.getContext('2d');
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (!regions || regions.length === 0) {
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '14px Inter';
                    ctx.textAlign = 'center';
                    ctx.fillText('请先上传图片进行分析', canvas.width / 2, canvas.height / 2);
                    return;
                }

                const gridXValues = [...new Set(regions.map(r => r.grid_x))].sort((a, b) => a - b);
                const maxCount = Math.max(...regions.map(r => r.detection_count), 1);
                
                const barWidth = (canvas.width - 40) / gridXValues.length;
                const padding = 20;
                
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#22c55e');
                gradient.addColorStop(1, '#86efac');
                
                gridXValues.forEach((x, i) => {
                    const region = regions.find(r => r.grid_x === x);
                    const count = region ? region.detection_count : 0;
                    const height = (count / maxCount) * (canvas.height - 40);
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.roundRect(padding + i * barWidth + 4, canvas.height - padding - height, barWidth - 8, height, 4);
                    ctx.fill();
                    
                    ctx.fillStyle = '#64748b';
                    ctx.font = '10px Inter';
                    ctx.textAlign = 'center';
                    ctx.fillText(`X${x}`, padding + i * barWidth + barWidth / 2, canvas.height - 8);
                });
            }
        });
    </script>
    <script src="/static/js/page.js"></script>
</body>
</html>

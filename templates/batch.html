<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ?- </title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css"><link rel="stylesheet" href="/static/css/responsive.css">
    <link rel="stylesheet" href="/static/css/animations.css">
</head>
<body>
    {% include 'navbar.html' %}
    
    <div class="app-container">
        {% include 'sidebar.html' %}
        
        <main class="main-content" id="mainContent">
            <div class="page-header animate-fade-in">
                <h1></h1>
                <p>?/p>
            </div>

            <div class="batch-container">
                <div class="upload-zone animate-fade-in" style="animation-delay: 0.1s">
                    <div class="drop-zone" id="batchDropZone">
                        <div class="drop-icon">
                            <i class="fas fa-images"></i>
                        </div>
                        <p></p>
                        <p class="drop-hint">?20 ?/p>
                        <input type="file" id="batchFileInput" accept="image/*" multiple style="display: none">
                    </div>
                    
                    <div class="file-grid" id="fileGrid"></div>
                </div>

                <div class="batch-settings animate-fade-in" style="animation-delay: 0.2s">
                    <div class="section-header">
                        <h2><i class="fas fa-cog"></i> </h2>
                    </div>
                    
                    <div class="settings-card">
                        <div class="setting-item">
                            <label></label>
                            <select class="setting-select">
                                <option value="tea"></option>
                                <option value="lettuce"></option>
                                <option value="spinach"></option>
                                <option value="celery"></option>
                                <option value="tobacco"></option>
                                <option value="mulberry"></option>
                            </select>
                        </div>
                        
                        <div class="setting-item">
                            <label class="checkbox-label">
                                <input type="checkbox" checked>
                                <span></span>
                            </label>
                        </div>
                        
                        <div class="setting-item">
                            <label class="checkbox-label">
                                <input type="checkbox" checked>
                                <span>?/span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="batch-progress" id="batchProgress" style="display: none;">
                    <div class="progress-header">
                        <span><i class="fas fa-spinner animate-spin"></i> ...</span>
                        <span class="progress-text">0%</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar"></div>
                    </div>
                    <div class="progress-info">
                        <span id="progressCurrent">0</span> / <span id="progressTotal">0</span> 
                    </div>
                </div>

                <div class="batch-actions animate-fade-in" style="animation-delay: 0.3s">
                    <button class="btn btn-primary btn-lg" id="processBatchBtn">
                        <i class="fas fa-play"></i>
                        ?
                    </button>
                    <button class="btn btn-outline btn-lg" id="clearBatchBtn">
                        <i class="fas fa-trash"></i>
                        
                    </button>
                </div>
            </div>

            <div class="batch-results" id="batchResults" style="display: none;">
                <div class="page-header animate-fade-in">
                    <h1></h1>
                    <p>?<span id="totalCount">0</span> ?/p>
                </div>
                
                <div class="results-summary animate-fade-in" style="animation-delay: 0.1s">
                    <div class="summary-card">
                        <div class="summary-icon total">
                            <i class="fas fa-image"></i>
                        </div>
                        <div class="summary-info">
                            <div class="summary-value" id="summaryTotal">0</div>
                            <div class="summary-label"></div>
                        </div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-icon mature">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="summary-info">
                            <div class="summary-value" id="summaryMature">0</div>
                            <div class="summary-label"></div>
                        </div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-icon avg">
                            <i class="fas fa-chart-pie"></i>
                        </div>
                        <div class="summary-info">
                            <div class="summary-value" id="summaryAvg">0%</div>
                            <div class="summary-label">?/div>
                        </div>
                    </div>
                </div>
                
                <div class="results-grid animate-fade-in" style="animation-delay: 0.2s" id="resultsGrid"></div>
            </div>
        </main>
    </div>

    <script src="/static/js/page.js"></script>
</body>
</html>

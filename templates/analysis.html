<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作物成熟度分析系统 - 单图分析</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    {% include 'navbar.html' %}
    
    <div class="app-container">
        {% include 'sidebar.html' %}
        
        <main class="main-content" id="mainContent">
            <div class="page-header">
                <h1>单图分析</h1>
                <p>上传单张图片进行作物成熟度检测</p>
            </div>

            <div class="analysis-container">
                <div class="upload-section">
                    <div class="section-header">
                        <h2><i class="fas fa-upload"></i> 上传图片</h2>
                    </div>
                    
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">
                            <i class="fas fa-cloud-upload-alt"></i>
                        </div>
                        <p>点击或拖拽上传图片</p>
                        <p class="upload-hint">支持 JPG、PNG、BMP 格式，最大50MB</p>
                        <input type="file" id="fileInput" accept="image/*" style="display: none">
                    </div>
                    
                    <div class="preview-section" id="previewSection">
                        <div class="preview-placeholder">
                            <i class="fas fa-image"></i>
                            <p>图片预览区域</p>
                        </div>
                    </div>
                </div>

                <div class="settings-section">
                    <div class="section-header">
                        <h2><i class="fas fa-cog"></i> 检测设置</h2>
                    </div>
                    
                    <div class="settings-card">
                        <div class="setting-item">
                            <label>作物类型</label>
                            <div class="crop-selector" id="cropSelector">
                                <div class="crop-chip active" data-crop="Pepper__bell">
                                    <span>🫑</span>
                                    <span>甜椒</span>
                                </div>
                                <div class="crop-chip" data-crop="Potato">
                                    <span>🥔</span>
                                    <span>土豆</span>
                                </div>
                                <div class="crop-chip" data-crop="Tomato">
                                    <span>🍅</span>
                                    <span>番茄</span>
                                </div>
                                <div class="crop-chip" data-crop="Lychee">
                                    <span>🍒</span>
                                    <span>荔枝</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="action-section">
                    <button class="btn btn-primary btn-lg" id="analyzeBtn">
                        <i class="fas fa-play"></i> 开始分析
                    </button>
                    <button class="btn btn-secondary btn-lg" id="resetBtn">
                        <i class="fas fa-refresh"></i> 重置
                    </button>
                </div>
            </div>

            <div class="results-section" id="resultsSection" style="display: none;">
                <div class="page-header">
                    <h1>分析结果</h1>
                    <div class="header-actions">
                        <button class="btn btn-secondary" id="backBtn"><i class="fas fa-arrow-left"></i> 返回</button>
                    </div>
                </div>

                <div class="stats-overview">
                    <div class="stat-card">
                        <div class="stat-icon primary">
                            <i class="fas fa-leaf"></i>
                        </div>
                        <div class="stat-info">
                            <div class="stat-value" id="totalCount">0</div>
                            <div class="stat-label">检测总数</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon success">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="stat-info">
                            <div class="stat-value" id="matureRate">0%</div>
                            <div class="stat-label">成熟率</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon warning">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <div class="stat-info">
                            <div class="stat-value" id="avgConfidence">0%</div>
                            <div class="stat-label">平均置信度</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon info">
                            <i class="fas fa-star"></i>
                        </div>
                        <div class="stat-info">
                            <div class="stat-value" id="avgQuality">0</div>
                            <div class="stat-label">平均品质评分</div>
                        </div>
                    </div>
                </div>

                <div class="charts-row">
                    <div class="chart-card">
                        <div class="card-header">
                            <h3><i class="fas fa-pie-chart"></i> 成熟度分布</h3>
                        </div>
                        <div class="chart-container">
                            <canvas id="maturityChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="results-grid">
                    <div class="result-card">
                        <div class="card-header">
                            <h3><i class="fas fa-list"></i> 检测详情</h3>
                        </div>
                        <div class="card-body">
                            <div class="table-container">
                                <table class="result-table" id="resultTable">
                                    <thead>
                                        <tr>
                                            <th>序号</th>
                                            <th>成熟度</th>
                                            <th>置信度</th>
                                            <th>品质评分</th>
                                            <th>绿色占比</th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="result-card">
                        <div class="card-header">
                            <h3><i class="fas fa-download"></i> 导出报告</h3>
                        </div>
                        <div class="card-body">
                            <div class="export-options">
                                <button class="btn btn-outline" onclick="exportReport('csv')">
                                    <i class="fas fa-file-csv"></i> CSV
                                </button>
                                <button class="btn btn-outline" onclick="exportReport('excel')">
                                    <i class="fas fa-file-excel"></i> Excel
                                </button>
                                <button class="btn btn-outline" onclick="exportReport('pdf')">
                                    <i class="fas fa-file-pdf"></i> PDF
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            
        </main>
    </div>

    <script>
        var currentCropType = 'Pepper__bell';
        var currentAnalysisData = [];

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.crop-chip').forEach(function(chip) {
                chip.addEventListener('click', function() {
                    document.querySelectorAll('.crop-chip').forEach(function(c) {
                        c.classList.remove('active');
                    });
                    this.classList.add('active');
                    currentCropType = this.dataset.crop;
                });
            });

            var uploadArea = document.getElementById('uploadArea');
            var fileInput = document.getElementById('fileInput');
            var previewSection = document.getElementById('previewSection');

            uploadArea.addEventListener('click', function() {
                fileInput.click();
            });

            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.classList.add('drag-over');
            });

            uploadArea.addEventListener('dragleave', function() {
                uploadArea.classList.remove('drag-over');
            });

            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('drag-over');
                var files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFile(files[0]);
                }
            });

            fileInput.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            });

            document.getElementById('analyzeBtn').addEventListener('click', function() {
                analyzeImage();
            });

            document.getElementById('resetBtn').addEventListener('click', function() {
                resetAnalysis();
            });
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('请上传图片文件');
                return;
            }

            var reader = new FileReader();
            reader.onload = function(e) {
                var previewSection = document.getElementById('previewSection');
                previewSection.innerHTML = '<img src="' + e.target.result + '" id="previewImage" class="preview-image">';
            };
            reader.readAsDataURL(file);
        }

        function analyzeImage() {
            var previewImage = document.getElementById('previewImage');
            if (!previewImage) {
                alert('请先上传图片');
                return;
            }

            var analyzeBtn = document.getElementById('analyzeBtn');
            var originalText = analyzeBtn.innerHTML;
            analyzeBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 分析中...';
            analyzeBtn.disabled = true;

            var formData = new FormData();
            formData.append('image', dataURLtoBlob(previewImage.src), 'crop.jpg');
            formData.append('crop_type', currentCropType);

            fetch('/api/analyze_maturity', {
                method: 'POST',
                body: formData,
                credentials: 'include'
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                analyzeBtn.innerHTML = originalText;
                analyzeBtn.disabled = false;
                
                if (data.success) {
                    currentAnalysisData = data.detections;
                    displayResults(data);
                    
                    // 保存到历史记录
                    saveToHistory({
                        image: previewImage.src,
                        crop_type: currentCropType,
                        detections: data.detections,
                        summary: data.summary
                    });
                    
                    showToast('分析完成！检测到 ' + (data.summary.total_count || 0) + ' 个目标', 'success');
                } else {
                    alert(data.error || '分析失败');
                }
            })
            .catch(function(error) {
                analyzeBtn.innerHTML = originalText;
                analyzeBtn.disabled = false;
                alert('分析失败: ' + error.message);
            });
        }
        
        function saveToHistory(data) {
            var history = JSON.parse(localStorage.getItem('analysisHistory') || '[]');
            var record = {
                id: 'REC-' + Date.now(),
                timestamp: new Date().toISOString(),
                image: data.image,
                crop_type: data.crop_type,
                crop_name: getCropName(data.crop_type),
                total_count: data.summary.total_count || 0,
                mature_rate: data.summary.mature_rate || 0,
                avg_confidence: data.summary.avg_confidence || 0,
                avg_quality: data.summary.avg_quality || 0,
                detections: data.detections,
                summary: data.summary
            };
            history.unshift(record);
            if (history.length > 100) {
                history = history.slice(0, 100);
            }
            localStorage.setItem('analysisHistory', JSON.stringify(history));
        }
        
        function getCropName(cropType) {
            var names = {
                'Pepper__bell': '甜椒',
                'Potato': '土豆',
                'Tomato': '番茄',
                'Lychee': '荔枝',
                'Tea': '茶叶',
                'Tobacco': '烟叶'
            };
            return names[cropType] || cropType;
        }
        
        function showToast(message, type) {
            var toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            toast.innerHTML = '<i class="fas fa-' + (type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle') + '"></i><span>' + message + '</span>';
            document.body.appendChild(toast);
            setTimeout(function() {
                toast.classList.add('show');
            }, 10);
            setTimeout(function() {
                toast.classList.remove('show');
                setTimeout(function() {
                    toast.remove();
                }, 300);
            }, 3000);
        }

        function dataURLtoBlob(dataURL) {
            var arr = dataURL.split(',');
            var mime = arr[0].match(/:(.*?);/)[1];
            var bstr = atob(arr[1]);
            var n = bstr.length;
            var u8arr = new Uint8Array(n);
            while (n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], { type: mime });
        }

        function displayResults(data) {
            document.querySelector('.analysis-container').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'block';

            document.getElementById('totalCount').textContent = data.summary.total_count || 0;
            document.getElementById('matureRate').textContent = (data.summary.mature_rate || 0) + '%';
            document.getElementById('avgConfidence').textContent = (data.summary.avg_confidence || 0) + '%';
            document.getElementById('avgQuality').textContent = data.summary.avg_quality || 0;

            document.getElementById('backBtn').addEventListener('click', function() {
                resetAnalysis();
            });

            var ctx = document.getElementById('maturityChart');
            if (ctx) {
                var maturityData = data.summary.maturity_distribution || {};
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['幼嫩期', '生长期', '成熟期', '过熟期'],
                        datasets: [{
                            data: [
                                maturityData['幼嫩期'] || 0,
                                maturityData['生长期'] || 0,
                                maturityData['成熟期'] || 0,
                                maturityData['过熟期'] || 0
                            ],
                            backgroundColor: ['#8bc34a', '#ffc107', '#4caf50', '#e53935'],
                            borderWidth: 0,
                            hoverOffset: 10
                        }]
                    },
                    options: {
                        responsive: true,
                        cutout: '65%',
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: {
                                    padding: 20,
                                    usePointStyle: true
                                }
                            }
                        }
                    }
                });
            }

            var tableBody = document.querySelector('#resultTable tbody');
            tableBody.innerHTML = '';
            
            currentAnalysisData.forEach(function(item, index) {
                var maturityColor = getMaturityColor(item.maturity);
                var row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><span class="maturity-badge" style="background-color: ${maturityColor}">${item.maturity}</span></td>
                    <td><span class="confidence-bar"><span style="width: ${item.confidence || 0}%"></span></span> ${item.confidence || 0}%</td>
                    <td>${item.quality_score || 0}</td>
                    <td>${item.green_ratio || 0}%</td>
                `;
                tableBody.appendChild(row);
            });
        }

        function getMaturityColor(maturity) {
            var colors = {
                '幼嫩期': '#8bc34a',
                '生长期': '#ffc107',
                '成熟期': '#4caf50',
                '过熟期': '#e53935'
            };
            return colors[maturity] || '#9e9e9e';
        }

        function exportReport(format) {
            if (currentAnalysisData.length === 0) {
                alert('无数据可导出');
                return;
            }

            fetch('/api/export_data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    format: format,
                    data: currentAnalysisData
                }),
                credentials: 'include'
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                if (data.success) {
                    window.location.href = data.download_url;
                    alert('报告导出成功');
                } else {
                    alert(data.error || '导出失败');
                }
            })
            .catch(function(error) {
                alert('导出失败: ' + error.message);
            });
        }

        function resetAnalysis() {
            document.querySelector('.analysis-container').style.display = 'flex';
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('previewSection').innerHTML = '<div class="preview-placeholder"><i class="fas fa-image"></i><p>图片预览区域</p></div>';
            currentAnalysisData = [];
        }
    </script>
    <script src="/static/js/page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作物成熟度检测系统 - 欢迎页</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 80px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            margin-bottom: 30px;
        }

        .logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(17, 153, 142, 0.4);
        }

        .logo i {
            font-size: 60px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 40px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 40px;
        }

        .feature-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 25px;
            border-radius: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .feature-icon {
            font-size: 36px;
            color: #11998e;
            margin-bottom: 15px;
        }

        .feature-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .feature-desc {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(17, 153, 142, 0.5);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .footer {
            margin-top: 40px;
            color: #999;
            font-size: 0.9rem;
        }

        @media (max-width: 900px) {
            .features {
                grid-template-columns: 1fr;
            }
            
            .welcome-container {
                padding: 40px 30px;
                margin: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="logo-section">
            <div class="logo">
                <i class="fa fa-leaf"></i>
            </div>
            <h1>作物成熟度检测系统</h1>
            <p class="subtitle">基于深度学习的智能作物分析平台</p>
        </div>

        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fa fa-image"></i>
                </div>
                <div class="feature-title">图像识别</div>
                <div class="feature-desc">高精度叶片检测与成熟度分析</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fa fa-video-camera"></i>
                </div>
                <div class="feature-title">视频分析</div>
                <div class="feature-desc">实时视频流作物状态监测</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fa fa-bar-chart"></i>
                </div>
                <div class="feature-title">数据分析</div>
                <div class="feature-desc">可视化报告与批量处理功能</div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="window.location.href='/login'">
                <i class="fa fa-sign-in"></i> 登录系统
            </button>
            <button class="btn btn-secondary" onclick="window.location.href='/help'">
                <i class="fa fa-question-circle"></i> 了解更多
            </button>
        </div>

        <div class="footer">
            © 2026 作物成熟度检测系统 | 智能农业解决方案
        </div>
    </div>
</body>
</html>
